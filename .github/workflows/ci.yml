name: CI

on: push

permissions:
  contents: read

jobs:
  test-and-build:
    name: Test and build
    runs-on: macos-26
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Run tests and checks
        run: ./scripts/check.sh

      - name: Build app and core package
        run: ./scripts/build.sh
